[package]
name = "anydoc-cabi"
version = "0.1.0"
edition = "2024"
publish = false
description = "C-ABI wasm exports wrapping the anydoc document converter"

[lib]
crate-type = ["cdylib"]

[dependencies]
anydoc = { path = "../third-party/anydoc" }

# 替换 crates.io 的 web-time 为本地 std 实现：
# 去掉 js-sys/wasm-bindgen，wasm 产物不再包含 __wbindgen_* 符号
# （同版本号 1.1.0；见 patches/web-time）
#
# 替换 getrandom 为本地 stub（见 patches/getrandom）：
# 去掉 wasm-unknown 上的 js-sys/wasm-bindgen（getrandom 的 wasm_js backend），
# PDF 启用时也不再产生 __wbindgen_* 宿主导入。
[patch.crates-io]
web-time = { path = "../patches/web-time" }
getrandom = { path = "../patches/getrandom" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
