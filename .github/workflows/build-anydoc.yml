#
# anydoc-go CI：构建 wasm → wasm2go → Go 二进制，跑测试并归档产物。
# 与 build.sh 同一路径：fetch / wasm / cli / test。
#
# 触发：
#   - push 到 main：构建 + 测试 + 上传 artifact
#   - workflow_dispatch 且填写 version（如 1.0.0）：额外打 tag 发布 Release
#
name: Build anydoc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)；留空则只构建并上传 artifact"
        required: false
        type: string
  push:
    branches: ["main"]

permissions:
  contents: write # gh-release 上传资产需要；构建读取用不到

concurrency:
  group: build-anydoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # build.sh 默认把工具链缓存放在仓库根（.rustup/.cargo/target/…）；
      # CI 上改用 runner 的 home，避免污染工作区并方便 actions/cache。
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable # dtolnay/rust-toolchain 无默认 toolchain，必须显式
          target: wasm32-unknown-unknown

      # 注：zig 只为无 C 编译器的环境准备（见 build.sh/README 本机约束）；
      # ubuntu runner 自带 gcc，直接作为 rustc 的 cc。

      - name: Cache cargo & Go build artifacts
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.cargo
            target/
            .go-cache/
          key: anydoc-build-${{ runner.os }}-${{ hashFiles('cabi/Cargo.lock', 'go.mod') }}
          restore-keys: |
            anydoc-build-${{ runner.os }}-

      - name: Fetch third-party repos
        run: ./build.sh fetch

      - name: Build wasm + Go binary
        run: ./build.sh build

      - name: Run tests
        run: ./build.sh test

      - name: Smoke test CLI output
        run: |
          ./bin/anydoc -s testdata/fixtures/docx/text.docx > /tmp/smoke.md
          diff /tmp/smoke.md testdata/expected/docx/text.md

      # core 是纯 Go + 嵌入式 wasm 数据（无 cgo），Linux runner 上即可
      # 交叉编译全部平台；发布版用标准优化（本机 -N -l 只是内存妥协）。
      - name: Build cross-platform binaries
        run: |
          set -euxo pipefail
          mkdir -p dist
          build() {
            os=$1 arch=$2 ext=$3
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/anydoc-${os}-${arch}${ext}" .
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin amd64 ""
          build darwin arm64 ""
          file dist/*

      - name: Upload linux/amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-linux-amd64
          path: dist/anydoc-linux-amd64
          retention-days: 3
          archive: false

      - name: Upload linux/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-linux-arm64
          path: dist/anydoc-linux-arm64
          retention-days: 3
          archive: false

      - name: Upload windows/amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-windows-amd64
          path: dist/anydoc-windows-amd64.exe
          retention-days: 3
          archive: false

      - name: Upload windows/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-windows-arm64
          path: dist/anydoc-windows-arm64.exe
          retention-days: 3
          archive: false

      - name: Upload darwin/amd64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-darwin-amd64
          path: dist/anydoc-darwin-amd64
          retention-days: 3
          archive: false

      - name: Upload darwin/arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-darwin-arm64
          path: dist/anydoc-darwin-arm64
          retention-days: 3
          archive: false

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}