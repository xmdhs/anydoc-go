#
# anydoc-go CI：构建 wasm → wasm2go → Go 二进制，跑测试并归档产物。
# 与 build.sh 同一路径：fetch / wasm / cli / test。
#
name: Build anydoc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)；留空则只构建并上传 artifact"
        required: false
        type: string
  push:
    branches: ["main"]

permissions:
  contents: write # gh-release 上传资产需要；构建读取用不到

concurrency:
  group: build-anydoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # build.sh 默认把工具链缓存放在仓库根（.rustup/.cargo/target/…）；
      # CI 上改用 runner 的 home，避免污染工作区并方便 actions/cache。
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
      # 与 generate-core.yml 同锁 anydoc 版本：patches/（pdf-inspector stub
      # 版本号、源码 patch）只对 v0.1.8 验证过，build.sh 默认值与此一致。
      ANYDOC_REF: v0.2.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable # dtolnay/rust-toolchain 无默认 toolchain，必须显式
          target: wasm32-unknown-unknown

      # 注：zig 只为无 C 编译器的环境准备（见 build.sh/README 本机约束）；
      # ubuntu runner 自带 gcc，直接作为 rustc 的 cc。

      - name: Cache cargo, Go, and generator artifacts
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.cargo
            target/
            .go-cache/
            .gopath/
          key: anydoc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cabi/Cargo.lock', 'go.mod', 'build.sh', 'patches/*.patch') }}
          restore-keys: |
            anydoc-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch third-party repos and apply patches
        run: ./build.sh fetch

      - name: Build wasm + pure Go binary
        run: ./build.sh build

      - name: Validate pure generated core
        run: |
          set -euxo pipefail
          if find core -type f \( -name '*.s' -o -name 'decls_*.go' \) -print -quit | grep -q .; then
            echo 'pure generation unexpectedly emitted asm artifacts' >&2
            exit 1
          fi
          git diff --check

      - name: Run tests
        run: ./build.sh test

      - name: Smoke test CLI output
        run: |
          ./bin/anydoc -s testdata/fixtures/docx/text.docx > /tmp/smoke.md
          diff /tmp/smoke.md testdata/expected/docx/text.md

      # core 是纯 Go + 嵌入式 wasm 数据（无 cgo），Linux runner 上即可
      # 交叉编译全部平台，无宿主 asm 或 GOAMD64 要求。
      - name: Build cross-platform binaries
        run: |
          set -euxo pipefail
          mkdir -p dist
          build() {
            os=$1 arch=$2 ext=$3
            # 默认构建即合并解析路径（core 常驻 AnydocConvert），发布产物与
            # ./build.sh test 验证的是同一代码路径。
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags="-s -w" -o "dist/anydoc-${os}-${arch}${ext}" .
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 .exe
          build windows arm64 .exe
          build darwin amd64 ""
          build darwin arm64 ""
          file dist/*

      - name: Upload cross-platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-binaries
          path: dist/*
          retention-days: 3
          # 多文件上传必须打包归档（archive: false 只允许单文件）；产物以 zip 提供

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
