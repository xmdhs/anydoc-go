#
# anydoc-go CI：构建 wasm → wasm2go → Go 二进制，跑测试并归档产物。
# 与 build.sh 同一路径：fetch / wasm / cli / test。
#

name: Build anydoc

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)；留空则只构建并上传 artifact"
        required: false
        type: string
  push:
    branches: ["main"]

permissions:
  contents: write # gh-release 上传资产需要；构建读取用不到

concurrency:
  group: build-anydoc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
      # build.sh 默认将 GOCACHE/GOPATH 指向仓库根的 .go-cache/.gopath
      # （见 .gitignore，属本地临时目录）；CI 改用 runner 标准缓存位置，
      # 配合 actions/setup-go 的 cache 命中.
      GOCACHE: /home/runner/.cache/go-build
      GOPATH: /home/runner/go
      # 与 generate-core.yml 同锁 anydoc 版本：patches/（pdf-inspector stub
      # 版本号、源码 patch）只对该版本验证过，build.sh 默认值与此一致。
      ANYDOC_REF: v0.2.4
      GOCCY_REF: f57f53361e9e507a8a8df83b82338c1901a77ce7
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable # dtolnay/rust-toolchain 无默认 toolchain，必须显式
          target: wasm32-unknown-unknown

      # 注：zig 只为无 C 编译器的环境准备（见 build.sh/README 本机约束）；
      # ubuntu runner 自带 gcc，直接作为 rustc 的 cc。

      - name: Cache cargo and generator artifacts
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/.cargo
            target/
          key: anydoc-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cabi/Cargo.lock', 'go.mod', 'build.sh', 'patches/*.patch') }}
          restore-keys: |
            anydoc-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch third-party repos and apply patches
        run: ./build.sh fetch

      - name: Build wasm + pure Go binary
        run: ./build.sh build

      - name: Validate pure generated core
        run: |
          set -euxo pipefail
          if find core -type f \( -name '*.s' -o -name 'decls_*.go' \) -print -quit | grep -q .; then
            echo 'pure generation unexpectedly emitted asm artifacts' >&2
            exit 1
          fi
          git diff --check

      - name: Run tests
        run: ./build.sh test

      - name: Smoke test CLI output
        run: |
          ./bin/anydoc -s testdata/fixtures/docx/text.docx > /tmp/smoke.md
          diff /tmp/smoke.md testdata/expected/docx/text.md

  # core 是纯 Go + 嵌入式 wasm 数据（无 cgo），Linux runner 上即可
  # 交叉编译全部平台，无宿主 asm 或 GOAMD64 要求。
  cross-build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          set -euxo pipefail
          # 默认构建即合并解析路径（core 常驻 AnydocConvert），发布产物与
          # ./build.sh test 验证的是同一代码路径。
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -trimpath -ldflags="-s -w" -o "anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" .
          file "anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ls -lh "anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

      - name: Compress binary with UPX (Linux/Windows only; Mach-O skipped)
        run: |
          set -euxo pipefail
          upx --version
          echo "before:"
          ls -lh "anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          # Mach-O (darwin) 在 macOS 13+ 上因 Apple 未公开的加载器变更已不可用
          # （UPX #612 / #777 / #786：压缩后运行时 Killed: 9 / invalid Mach-O header，
          #  需 --force-macos 才允许压缩但产物仍无法在 13+ 运行），故仅压缩 ELF/PE。
          f="anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          echo "upx $f"
          upx --best --lzma "$f" 2>&1 || upx --best "$f" 2>&1 || echo "warn: upx failed for $f, keeping original" >&2
          echo "after:"
          ls -lh "$f"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: anydoc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 3

  collect:
    name: Collect binaries
    needs: cross-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v7
        with:
          pattern: anydoc-*
          path: dist
          merge-multiple: true

      - name: List collected binaries
        run: |
          set -euxo pipefail
          ls -lh dist/
          file dist/*

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: Upload cross-platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: anydoc-binaries
          path: dist/*
          retention-days: 3
          # 多文件上传必须打包归档（archive: false 只允许单文件）；产物以 zip 提供

  release:
    name: Release
    needs: collect
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v7
        with:
          name: anydoc-binaries
          path: dist

      - name: List release assets
        run: |
          set -euxo pipefail
          ls -lh dist/
          file dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
